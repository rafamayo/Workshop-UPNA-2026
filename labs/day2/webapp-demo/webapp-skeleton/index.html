<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"/>
    <title>FHIR Web App Demo</title>
    <link rel="stylesheet" href="./style.css"/>
</head>
<body>

    <header>
        <h1>FHIR Web App Demo</h1>
        <p>UPNA Workshop 2026</p>

    <section id="output">

    </section>

    <script src="./app.js"></script>

</html>
